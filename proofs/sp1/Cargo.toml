[workspace]
members = ["pod-program", "task-program", "host"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
bincode = "1.3.3"
pocomp-protocol = { path = "../../crates/pocomp-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sp1-build = { git = "https://github.com/succinctlabs/sp1.git", rev = "150e6294959f40dbc3ba42eb21c8eccc14c95bc5" }
sp1-sdk = { git = "https://github.com/succinctlabs/sp1.git", rev = "150e6294959f40dbc3ba42eb21c8eccc14c95bc5" }
sp1-zkvm = { git = "https://github.com/succinctlabs/sp1.git", rev = "150e6294959f40dbc3ba42eb21c8eccc14c95bc5" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
