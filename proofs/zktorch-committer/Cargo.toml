[workspace]

[package]
name = "pocomp-zktorch-committer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
ark-bn254 = "0.4"
ark-serialize = "0.4"
axum = "0.8"
bincode = "1.3.3"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
ndarray = "0.15.6"
pocomp-protocol = { path = "../../crates/pocomp-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
zk_torch = { path = "../../third_party/zk-torch" }
