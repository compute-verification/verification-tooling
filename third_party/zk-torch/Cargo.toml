[package]
name = "zk_torch"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-std = { version = "0.4", features = ["parallel"] }
ark-ff = { version = "0.4", features = ["parallel"] }
ark-ec = "0.4"
ark-poly = { version = "0.4", features = ["parallel"] }
ark-bn254 = "0.4"
ark-serialize = { version = "0.4", features = ["derive"] }
serde = { version = "1.0.201", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
once_cell = "1.15"
log = { version = "0.4.14", default-features = false }
env_logger = { version = "0.10" }
plonky2 = { version = "0.2.2", features = ["timing"] }
prost = "0.11.9"
rand = "0.8.5"
rayon = "1"
ndarray = { version = "0.15.6", features = ["serde", "rayon"] }
tract-onnx = "=0.21.6"
sha3 = "0.10.8"
bincode = "1.3.3"
itertools = "0.13.0"
downcast-rs = "2.0.1"
pocomp-protocol = { path = "../../crates/pocomp-protocol" }
icicle-bn254 = { path = "../icicle-v1.10.1/wrappers/rust/icicle-curves/icicle-bn254", optional = true, features = ["arkworks", "g2", "ec_ntt"] }
icicle-core = { path = "../icicle-v1.10.1/wrappers/rust/icicle-core", optional = true, features = ["arkworks"] }
icicle-cuda-runtime = { path = "../icicle-v1.10.1/wrappers/rust/icicle-cuda-runtime", optional = true }

[features]
icicle = ["dep:icicle-bn254", "dep:icicle-core", "dep:icicle-cuda-runtime"]
debug = []
# These names are retained so accidental use fails with an explicit message
# from lib.rs instead of silently selecting an unsupported proof mode.
mock_prove = []
fold = []
