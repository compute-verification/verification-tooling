[workspace]
members = [
    "crates/pocomp-protocol",
    "crates/pocomp-cli",
    "crates/pocomp-gateway",
    "crates/pocomp-cupow-auditor",
    "crates/pocomp-cupow-runner",
    "crates/pocomp-verifier",
]
resolver = "2"
exclude = [
    "proofs/sp1",
    "proofs/zktorch-committer",
    "third_party/icicle-v1.10.1",
    "third_party/zk-torch",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.7"
clap = { version = "4.5.51", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hex = "0.4.3"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
